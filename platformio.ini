; PlatformIO Project Configuration File
; MimiClaw ESP32-S3 AI Agent
;
; Dual Build System Support:
; - ESP-IDF Native: idf.py build flash monitor
; - PlatformIO: pio run -t upload && pio run -t uploadfs
;
; NOTE: PlatformIO's checkprogsize uses board's maximum_size (default 1MB),
; but ESP-IDF partition table defines 2MB app partition (ota_0 = 0x200000).
; We override maximum_size to match our partition table.

[platformio]
src_dir = main
data_dir = spiffs_data
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_CACHE_WORKAROUND

upload_speed = 460800

debug_tool = esp-builtin
debug_init_break = tbreak app_main